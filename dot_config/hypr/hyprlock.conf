background {
    monitor = DP-1
    path = $XDG_CONFIG_HOME/hypr/assets/wallpaper_landscape.png
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 0
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(29,27,30)
    inner_color = rgb(254,248,252)
    font_color = rgb(29,27,30)

    fade_on_empty = true
    placeholder_text = <span font_size="9pt" font_family="SpaceMono Nerd Font" foreground="##1D1B1E">Password</span>
    hide_input = false

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(29,27,30)
    font_size = 50
    font_family = SpaceMono Nerd Font

    position = 20, 0
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] playerctl metadata --format \{\{artist}}\ -\ \{\{title}} 
    color = rgb(29,27,30)
    font_size = 12
    font_family = SpaceMono Nerd Font

    position = 25, 80
    halign = left
    valign = bottom
}
